<rect x="67" y="30" width="3" height="3" fill="#4f8cff" opacity="0.75"/>
<rect x="26" y="63" width="11" height="11" rx="2" fill="none" stroke="#4f8cff" stroke-width="2.5" opacity="0.75"/>
<rect x="30" y="67" width="3" height="3" fill="#4f8cff" opacity="0.75"/>

<!-- scattered data modules, both halves -->
<rect x="44" y="27" width="5" height="5" fill="#4f8cff"/>
<rect x="52" y="27" width="5" height="5" fill="#4f8cff"/>
<rect x="44" y="35" width="5" height="5" fill="#4f8cff"/>
<rect x="43" y="44" width="5" height="5" fill="#4f8cff"/>
<rect x="52" y="44" width="5" height="5" fill="#4f8cff"/>
<rect x="60" y="44" width="5" height="5" fill="#4f8cff"/>
<rect x="44" y="52" width="5" height="5" fill="#4f8cff"/>
<rect x="52" y="60" width="5" height="5" fill="#4f8cff"/>
<rect x="60" y="52" width="5" height="5" fill="#4f8cff" opacity="0.6"/>
<rect x="65" y="65" width="5" height="5" fill="#4f8cff" opacity="0.55"/>
<rect x="38" y="44" width="5" height="5" fill="#4f8cff" opacity="0.6"/>
<rect x="30" y="52" width="5" height="5" fill="#4f8cff"/>
<rect x="38" y="52" width="5" height="5" fill="#4f8cff" opacity="0.55"/>
<rect x="30" y="60" width="5" height="5" fill="#4f8cff" opacity="0.6"/>
<rect x="44" y="60" width="5" height="5" fill="#4f8cff" opacity="0.55"/>
</g>
<rect x="20" y="20" width="60" height="60" rx="10" fill="none" stroke="#4f8cff" stroke-width="4" stroke-linejoin="round"/>

<!-- badge: same position/size as the JPG75 logo -->
<circle cx="70" cy="70" r="16" fill="#4f8cff" stroke="#131313" stroke-width="4"/>
<text x="70" y="75" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#131313" text-anchor="middle">QR</text>
</svg>
