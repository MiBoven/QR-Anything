<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<clipPath id="qrClip">
<rect x="20" y="20" width="60" height="60" rx="10"/>
</clipPath>
</defs>
<rect width="100" height="100" rx="22" fill="#131313"/><rect x="6" y="6" width="88" height="88" rx="18" fill="none" stroke="#4f8cff" stroke-width="2" opacity="0.35"/>

<g clip-path="url(#qrClip)">
<!-- finder markers, smaller + subtler, tucked into the rounded corners -->
<rect x="26" y="26" width="11" height="11" rx="2" fill="none" stroke="#4f8cff" stroke-width="2.5" opacity="0.75"/>
<rect x="30" y="30" width="3" height="3" fill="#4f8cff" opacity="0.75"/>
